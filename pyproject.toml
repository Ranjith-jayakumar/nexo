[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "0.1.0"
description = "Decision engine powered by sentence embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ranjith Jayakumar", email = "ranjith@example.com" }
]
keywords = ["decision-engine", "embeddings", "sentence-transformers", "utility", "ranking", "nexo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=2.0",
  "sentence-transformers>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/Ranjith-jayakumar/nexo"
Repository = "https://github.com/Ranjith-jayakumar/nexo"
Issues = "https://github.com/Ranjith-jayakumar/nexo/issues"

[project.scripts]
nexo = "nexo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
